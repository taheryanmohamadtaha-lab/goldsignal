name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build EXE (PyInstaller onedir)
        run: python -m PyInstaller goldsignal.spec --noconfirm
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "v=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" installer\goldsignal.iss'
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\GoldSignal\* -DestinationPath "Output\GoldSignal-portable-${{ steps.ver.outputs.v }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: GoldSignal-windows
          path: Output/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*
          generate_release_notes: true
